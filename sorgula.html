<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://telegram.org; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Araç Sorgulama</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Telegram'ın açık/koyu tema renklerini kullanır */
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --yazi: var(--tg-theme-text-color, #1f2937);
    --soluk: var(--tg-theme-hint-color, #6b7280);
    --vurgu: var(--tg-theme-button-color, #1f3b63);
    --vurgu-yazi: var(--tg-theme-button-text-color, #ffffff);
    --kutu: var(--tg-theme-secondary-bg-color, #eef2f7);
    --hata: #d93025;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 18px 16px 28px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--yazi); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.alt { margin: 0 0 14px; color: var(--soluk); font-size: 13px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--soluk); margin: 14px 0 6px; }
  label .zorunlu { color: var(--hata); }
  html, body { max-width: 100%; overflow-x: hidden; }
  input, select, textarea { display: block; min-width: 0; max-width: 100%; width: 100%; font: inherit; font-size: 16px; padding: 12px; border-radius: 10px;
                            border: 1px solid transparent; background: var(--kutu); color: var(--yazi); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--vurgu); }
  textarea { min-height: 84px; resize: vertical; }
  #plaka, #ikamePlaka { text-transform: uppercase; letter-spacing: 1px; }
  .secim { display: flex; gap: 8px; }
  .secim button { flex: 1; min-width: 0; padding: 12px; border-radius: 10px; border: 1px solid transparent; font-size: 15px;
                  background: var(--kutu); color: var(--yazi); }
  .secim button.secili { background: var(--vurgu); color: var(--vurgu-yazi); }
  .uyari { color: var(--hata); font-size: 13px; margin-top: 6px; min-height: 0; }
  .gizli { display: none; }
  .oneri { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .oneri button { padding: 8px 12px; border-radius: 16px; border: 1px solid var(--vurgu); background: transparent;
                  color: var(--yazi); font-size: 15px; letter-spacing: 1px; }
  .bilgi { color: var(--soluk); font-size: 13px; margin-top: 6px; }
  #gonder { display: none; width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 12px;
            font-size: 16px; background: var(--vurgu); color: var(--vurgu-yazi); }
</style>
</head>
<body>
<h1>Araç Sorgulama</h1>
<p class="alt">Lütfen sorgulamak istediğiniz aracın plakasını yazarak <b>Sorgula</b> düğmesine basınız. Sonuçlar sohbete gönderilir.</p>

<label for="plaka">Araç plakası <span class="zorunlu">*</span></label>
<input id="plaka" placeholder="Plaka yazınız" autocomplete="off" maxlength="12">
<div class="oneri" id="oneri"></div>
<div class="bilgi" id="b_plaka"></div>
<div class="uyari" id="u_plaka"></div>

<button id="gonder" type="button">Sorgula</button>

<script>
  // Veriler adresin # kısmında gelir (sunucuya hiç gönderilmez); Telegram kendi parametrelerini ekleyebilir
  function parametreler() {
    const p = new URLSearchParams(location.search);
    const h = location.hash.replace(/^#/, "").replace(/\?/g, "&");
    for (const [k, v] of new URLSearchParams(h)) if (!p.has(k)) p.set(k, v);
    return p;
  }
  // Bot kayıtlı plakaları (servis ve ikame) #p=PLAKA1,... ve kaydı olmayan filo plakalarını &f=... ile gönderir
  // Seçim bota JSON olarak gider: {"tur":"sorgula","plaka":"..."}
  const tg0 = window.Telegram && Telegram.WebApp;
  // Telegram içinde açıldıysa platform bilinir (menü düğmesiyle açılınca initData boş gelir, ona bakılmaz)
  const tg = tg0 && tg0.platform && tg0.platform !== "unknown" ? tg0 : null;
  const q = parametreler();
  const $ = id => document.getElementById(id);
  const plakaDuzelt = s => s.toLocaleUpperCase("tr-TR").replace(/[^0-9A-Z]/g, "");
  const kayitli = (q.get("p") || "").split(",").filter(Boolean);  // kaydı olan plakalar (en yeni önce)
  const filo = (q.get("f") || "").split(",").filter(Boolean);     // kaydı olmayan filo plakaları
  const plakalar = kayitli.concat(filo);

  function plakaOner() {
    const p = plakaDuzelt($("plaka").value), kutu = $("oneri");
    kutu.innerHTML = "";
    $("b_plaka").textContent = "";
    if (plakalar.includes(p)) {
      if (!kayitli.includes(p)) $("b_plaka").textContent = "Bu araç için henüz servis kaydı bulunmuyor.";
      return;
    }
    // kutu boşken son kayıtlı plakalar; yazınca kayıtlılar önce, sonra filo
    const es = (p ? plakalar.filter(x => x.includes(p)) : kayitli).slice(0, 8);
    for (const x of es) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = x;
      if (!kayitli.includes(x)) b.style.opacity = "0.6";  // kaydı olmayan filo aracı
      b.onclick = () => { $("plaka").value = x; plakaOner(); $("u_plaka").textContent = ""; };
      kutu.appendChild(b);
    }
    if (p.length >= 2 && !es.length) $("b_plaka").textContent = "Bu plakaya ait kayıt görünmüyor; yine de sorgulayabilirsiniz.";
    else if (!p && es.length) $("b_plaka").textContent = "Son kayıtlı araçlar. Plakanın bir kısmını yazarak arayabilirsiniz.";
  }
  $("plaka").addEventListener("input", plakaOner);
  plakaOner();

  function gonder() {
    const plaka = plakaDuzelt($("plaka").value);
    $("u_plaka").textContent = "";
    if (plaka.length < 2) {
      $("u_plaka").textContent = "Lütfen aracın plakasını yazınız.";
      tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("error");
      return;
    }
    if (!tg) { alert("Bu form Telegram içinden açılmalıdır."); return; }
    tg.sendData(JSON.stringify({ tur: "sorgula", plaka }));
  }

  if (tg) {
    tg.ready(); tg.expand();
    tg.MainButton.setText("Sorgula").show().onClick(gonder);
  } else {
    $("gonder").style.display = "block"; $("gonder").onclick = gonder;
  }
</script>
</body>
</html>
