<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://telegram.org; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Lastik İşlem Formu</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Telegram'ın açık/koyu tema renklerini kullanır */
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --yazi: var(--tg-theme-text-color, #1f2937);
    --soluk: var(--tg-theme-hint-color, #6b7280);
    --vurgu: var(--tg-theme-button-color, #1f3b63);
    --vurgu-yazi: var(--tg-theme-button-text-color, #ffffff);
    --kutu: var(--tg-theme-secondary-bg-color, #eef2f7);
    --hata: #d93025;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 18px 16px 28px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--yazi); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.alt { margin: 0 0 14px; color: var(--soluk); font-size: 13px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--soluk); margin: 14px 0 6px; }
  label .zorunlu { color: var(--hata); }
  html, body { max-width: 100%; overflow-x: hidden; }
  input, textarea { display: block; min-width: 0; max-width: 100%; width: 100%; font: inherit; font-size: 16px; padding: 12px;
                    border-radius: 10px; border: 1px solid transparent; background: var(--kutu); color: var(--yazi); }
  input:focus, textarea:focus { outline: 2px solid var(--vurgu); }
  textarea { min-height: 84px; resize: vertical; }
  #plaka { text-transform: uppercase; letter-spacing: 1px; }
  .secim { display: flex; gap: 8px; }
  .secim button { flex: 1; min-width: 0; padding: 12px; border-radius: 10px; border: 1px solid transparent; font-size: 15px;
                  background: var(--kutu); color: var(--yazi); }
  .secim button.secili { background: var(--vurgu); color: var(--vurgu-yazi); }
  .uyari { color: var(--hata); font-size: 13px; margin-top: 6px; }
  .bilgi { color: var(--soluk); font-size: 13px; margin-top: 6px; }
  .oneri { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .oneri button { padding: 8px 12px; border-radius: 16px; border: 1px solid var(--vurgu); background: transparent;
                  color: var(--yazi); font-size: 15px; letter-spacing: 1px; }
  #gonder { display: none; width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 12px;
            font-size: 16px; background: var(--vurgu); color: var(--vurgu-yazi); }
  #fotoNot { margin-top: 16px; }
</style>
</head>
<body>
<h1>Lastik İşlem Formu</h1>
<p class="alt">Lütfen bilgileri doldurup <b>Kaydet</b> düğmesine basınız.</p>

<label for="plaka">Plaka <span class="zorunlu">*</span></label>
<input id="plaka" placeholder="Plaka veya son rakamları (ör. 01 ABC 123 / 123)" maxlength="12" autocomplete="off">
<div class="oneri" id="oneri"></div>
<div class="bilgi" id="b_plaka"></div>
<div class="uyari" id="u_plaka"></div>

<label>İşlem <span class="zorunlu">*</span></label>
<div class="secim" id="islem">
  <button type="button" data-v="Tamirat">Tamirat</button>
  <button type="button" data-v="Değişim">Değişim</button>
</div>
<div class="uyari" id="u_islem"></div>

<label for="km">Kilometre <span class="zorunlu">*</span></label>
<input id="km" inputmode="numeric" maxlength="7" placeholder="Aracın kilometresi (ör. 125400)" autocomplete="off">
<div class="uyari" id="u_km"></div>

<label for="tarih">Tarih <span class="zorunlu">*</span></label>
<input id="tarih" type="date">
<div class="uyari" id="u_tarih"></div>

<label for="aciklama">Açıklama (isteğe bağlı)</label>
<textarea id="aciklama" maxlength="500" placeholder="Örn: Sağ ön lastik patlak, yama yapıldı."></textarea>

<p class="bilgi" id="fotoNot">📷 <b>Fotoğraf zorunludur.</b> Kaydet'e bastıktan sonra sohbette <b>Fotoğraf ekle</b>
  düğmesiyle lastiğin fotoğrafını göndermeniz istenecektir; fotoğraf gönderilmeden kayıt tamamlanmaz.</p>

<button id="gonder" type="button">Kaydet</button>

<script>
  // Veriler adresin # kısmında gelir (sunucuya hiç gönderilmez); Telegram kendi parametrelerini ekleyebilir
  function parametreler() {
    const p = new URLSearchParams(location.search);
    const h = location.hash.replace(/^#/, "").replace(/\?/g, "&");
    for (const [k, v] of new URLSearchParams(h)) if (!p.has(k)) p.set(k, v);
    return p;
  }
  // Bot #f=PLAKA,PLAKA,... ile öneri plakalarını gönderir.
  // Kayıt bota JSON olarak gider: {"tur":"lastik","plaka":"...","islem":"Tamirat|Değişim","km":"125400",
  //                               "tarih":"YYYY-MM-DD","aciklama":"..."}  (fotoğraf sonra sohbetten, zorunlu)
  const tg0 = window.Telegram && Telegram.WebApp;
  const tg = tg0 && tg0.platform && tg0.platform !== "unknown" ? tg0 : null;
  const $ = id => document.getElementById(id);
  const filo = (parametreler().get("f") || "").split(",").filter(Boolean);
  const PLAKA = /^(0[1-9]|[1-7][0-9]|8[01])[A-Z]{1,3}[0-9]{2,4}$/;
  const temiz = s => s.toLocaleUpperCase("tr-TR").replace(/[^0-9A-Z]/g, "");

  const bugun = new Date(); bugun.setMinutes(bugun.getMinutes() - bugun.getTimezoneOffset());
  $("tarih").value = $("tarih").max = bugun.toISOString().slice(0, 10);

  function oner() {
    const p = temiz($("plaka").value), kutu = $("oneri");
    kutu.innerHTML = ""; $("b_plaka").textContent = ""; $("u_plaka").textContent = "";
    if (!filo.length || p.length < 2 || filo.includes(p)) return;
    const es = filo.filter(x => x.includes(p)).slice(0, 8);
    for (const x of es) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = x;
      b.onclick = () => { $("plaka").value = x; oner(); };
      kutu.appendChild(b);
    }
    if (!es.length && PLAKA.test(p)) $("b_plaka").textContent = "Bu plaka filo listesinde yok.";
  }
  $("plaka").addEventListener("input", oner);

  let islem = "";
  for (const b of $("islem").children) b.onclick = () => {
    islem = b.dataset.v;
    for (const x of $("islem").children) x.classList.toggle("secili", x === b);
    $("u_islem").textContent = "";
  };
  $("km").addEventListener("input", () => { $("km").value = $("km").value.replace(/\D/g, ""); });

  function kontrol() {
    ["u_plaka", "u_islem", "u_km", "u_tarih"].forEach(i => $(i).textContent = "");
    const plaka = temiz($("plaka").value), km = $("km").value, tarih = $("tarih").value;
    let ok = true;
    if (!PLAKA.test(plaka)) { $("u_plaka").textContent = "Geçerli bir plaka yazınız veya listeden seçiniz."; ok = false; }
    if (!islem) { $("u_islem").textContent = "Lütfen Tamirat veya Değişim seçiniz."; ok = false; }
    if (!/^[0-9]{1,7}$/.test(km) || +km === 0) { $("u_km").textContent = "Kilometre zorunludur (sadece rakam)."; ok = false; }
    if (!tarih || tarih > $("tarih").max) { $("u_tarih").textContent = "Geçerli bir tarih seçiniz (ileri tarih olamaz)."; ok = false; }
    return ok ? { tur: "lastik", plaka, islem, km, tarih, aciklama: $("aciklama").value.trim() } : null;
  }

  function gonder() {
    const veri = kontrol();
    if (!veri) { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("error"); return; }
    if (!tg) { alert("Bu form Telegram içinden açılmalıdır."); return; }
    tg.showConfirm(veri.plaka + " – Lastik " + veri.islem.toLocaleLowerCase("tr-TR") + "\n" + veri.km + " km, " +
                   veri.tarih.split("-").reverse().join(".") + "\nKaydedilsin mi?",
                   ok => { if (ok) tg.sendData(JSON.stringify(veri)); });
  }

  if (tg) {
    tg.ready(); tg.expand();
    tg.MainButton.setText("Kaydet").show().onClick(gonder);
  } else {
    $("gonder").style.display = "block"; $("gonder").onclick = gonder;
  }
</script>
</body>
</html>
