<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://telegram.org; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>İşlem Kaydı</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Telegram'ın açık/koyu tema renklerini kullanır */
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --yazi: var(--tg-theme-text-color, #1f2937);
    --soluk: var(--tg-theme-hint-color, #6b7280);
    --vurgu: var(--tg-theme-button-color, #1f3b63);
    --vurgu-yazi: var(--tg-theme-button-text-color, #ffffff);
    --kutu: var(--tg-theme-secondary-bg-color, #eef2f7);
    --hata: #d93025;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 18px 16px 28px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--yazi); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.alt { margin: 0 0 14px; color: var(--soluk); font-size: 13px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--soluk); margin: 14px 0 6px; }
  label .zorunlu { color: var(--hata); }
  html, body { max-width: 100%; overflow-x: hidden; }
  input, select, textarea { display: block; min-width: 0; max-width: 100%; width: 100%; font: inherit; font-size: 16px; padding: 12px; border-radius: 10px;
                            border: 1px solid transparent; background: var(--kutu); color: var(--yazi); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--vurgu); }
  textarea { min-height: 84px; resize: vertical; }
  #plaka, #ikamePlaka { text-transform: uppercase; letter-spacing: 1px; }
  .secim { display: flex; gap: 8px; }
  .secim button { flex: 1; min-width: 0; padding: 12px; border-radius: 10px; border: 1px solid transparent; font-size: 15px;
                  background: var(--kutu); color: var(--yazi); }
  .secim button.secili { background: var(--vurgu); color: var(--vurgu-yazi); }
  .uyari { color: var(--hata); font-size: 13px; margin-top: 6px; min-height: 0; }
  .gizli { display: none; }
  .oneri { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .oneri button { padding: 8px 12px; border-radius: 16px; border: 1px solid var(--vurgu); background: transparent;
                  color: var(--yazi); font-size: 15px; letter-spacing: 1px; }
  .bilgi { color: var(--soluk); font-size: 13px; margin-top: 6px; }
  #gonder { display: none; width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 12px;
            font-size: 16px; background: var(--vurgu); color: var(--vurgu-yazi); }
</style>
</head>
<body>
<h1>İşlem Kaydı</h1>
<p class="alt">Lütfen görmek istediğiniz işlemleri seçerek <b>Listele</b> düğmesine basınız. Sonuçlar sohbete gönderilir.</p>

<label>İşlem türü <span class="zorunlu">*</span></label>
<div class="secim tur">
  <button type="button" data-tur="Tümü" class="secili">Tümü</button>
  <button type="button" data-tur="Silme">Silme</button>
  <button type="button" data-tur="Düzeltme">Düzeltme</button>
</div>
<div class="secim tur" style="margin-top:8px">
  <button type="button" data-tur="Yetki">Yetki</button>
  <button type="button" data-tur="Ayar">Ayar</button>
  <button type="button" data-tur="İtiraz">İtiraz</button>
</div>

<label for="bas">Başlangıç tarihi <span class="zorunlu">*</span></label>
<input type="date" id="bas">
<label for="bit">Bitiş tarihi <span class="zorunlu">*</span></label>
<input type="date" id="bit">
<div class="uyari" id="u_tarih"></div>

<label for="kisi">İşlemi yapan kişi</label>
<input id="kisi" placeholder="İsim yazınız (boş bırakılırsa herkes)" maxlength="40" autocomplete="off">

<label for="adet">En fazla kaç kayıt</label>
<select id="adet">
  <option value="20" selected>20</option>
  <option value="50">50</option>
  <option value="100">100</option>
</select>

<button id="gonder" type="button">Listele</button>

<script>
  // Seçim bota JSON olarak gider: {"tur":"log","islem":"Tümü|Silme|...","bas":"YYYY-MM-DD","bit":"YYYY-MM-DD","kisi":"","adet":20}
  const tg0 = window.Telegram && Telegram.WebApp;
  // Telegram içinde açıldıysa platform bilinir (menü düğmesiyle açılınca initData boş gelir, ona bakılmaz)
  const tg = tg0 && tg0.platform && tg0.platform !== "unknown" ? tg0 : null;
  const $ = id => document.getElementById(id);
  const iso = x => new Date(x.getTime() - x.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const bugun = iso(new Date());
  $("bas").max = $("bit").max = bugun;
  $("bas").value = iso(new Date(Date.now() - 30 * 86400000)); $("bit").value = bugun;

  let islem = "Tümü";
  document.querySelectorAll(".tur button").forEach(b => b.onclick = () => {
    islem = b.dataset.tur;
    document.querySelectorAll(".tur button").forEach(x => x.classList.toggle("secili", x === b));
  });

  function gonder() {
    const bas = $("bas").value, bit = $("bit").value;
    $("u_tarih").textContent = "";
    if (!bas || !bit || bit > bugun) $("u_tarih").textContent = "Geçerli bir tarih aralığı seçiniz (ileri tarih seçilemez).";
    else if (bas > bit) $("u_tarih").textContent = "Başlangıç tarihi, bitiş tarihinden sonra olamaz.";
    if ($("u_tarih").textContent) { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("error"); return; }
    if (!tg) { alert("Bu form Telegram içinden açılmalıdır."); return; }
    tg.sendData(JSON.stringify({ tur: "log", islem, bas, bit, kisi: $("kisi").value.trim(), adet: Number($("adet").value) }));
  }

  if (tg) {
    tg.ready(); tg.expand();
    tg.MainButton.setText("Listele").show().onClick(gonder);
  } else {
    $("gonder").style.display = "block"; $("gonder").onclick = gonder;
  }
</script>
</body>
</html>
