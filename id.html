<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://telegram.org; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ID Sorgulama</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Telegram'ın açık/koyu tema renklerini kullanır */
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --yazi: var(--tg-theme-text-color, #1f2937);
    --soluk: var(--tg-theme-hint-color, #6b7280);
    --vurgu: var(--tg-theme-button-color, #1f3b63);
    --vurgu-yazi: var(--tg-theme-button-text-color, #ffffff);
    --kutu: var(--tg-theme-secondary-bg-color, #eef2f7);
    --hata: #d93025;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 18px 16px 28px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--yazi); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.alt { margin: 0 0 14px; color: var(--soluk); font-size: 13px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--soluk); margin: 14px 0 6px; }
  label .zorunlu { color: var(--hata); }
  html, body { max-width: 100%; overflow-x: hidden; }
  input, select, textarea { display: block; min-width: 0; max-width: 100%; width: 100%; font: inherit; font-size: 16px; padding: 12px; border-radius: 10px;
                            border: 1px solid transparent; background: var(--kutu); color: var(--yazi); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--vurgu); }
  textarea { min-height: 84px; resize: vertical; }
  #plaka, #ikamePlaka { text-transform: uppercase; letter-spacing: 1px; }
  .secim { display: flex; gap: 8px; }
  .secim button { flex: 1; min-width: 0; padding: 12px; border-radius: 10px; border: 1px solid transparent; font-size: 15px;
                  background: var(--kutu); color: var(--yazi); }
  .secim button.secili { background: var(--vurgu); color: var(--vurgu-yazi); }
  .uyari { color: var(--hata); font-size: 13px; margin-top: 6px; min-height: 0; }
  .gizli { display: none; }
  .oneri { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .oneri button { padding: 8px 12px; border-radius: 16px; border: 1px solid var(--vurgu); background: transparent;
                  color: var(--yazi); font-size: 15px; letter-spacing: 1px; }
  .bilgi { color: var(--soluk); font-size: 13px; margin-top: 6px; }
  #gonder { display: none; width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 12px;
            font-size: 16px; background: var(--vurgu); color: var(--vurgu-yazi); }
</style>
</head>
<body>
<h1>ID Sorgulama</h1>
<p class="alt">Lütfen öğrenmek istediğiniz ID'yi seçerek <b>Göster</b> düğmesine basınız. Sonuç sohbete gönderilir.</p>

<label>Hangi ID? <span class="zorunlu">*</span></label>
<div class="secim secenek">
  <button type="button" data-secim="ben" class="secili">Kendi ID'm</button>
  <button type="button" data-secim="grup">Grup ID</button>
  <button type="button" data-secim="ara">Kullanıcı seç</button>
</div>

<div id="araAlan" class="gizli">
  <label for="filtre">Kullanıcı <span class="zorunlu">*</span></label>
  <input id="filtre" placeholder="Listeyi daraltmak için isim yazınız" maxlength="40" autocomplete="off">
  <select id="ad" size="8" style="margin-top:8px"></select>
  <div class="uyari" id="u_ad"></div>
</div>

<button id="gonder" type="button">Göster</button>

<script>
  // Veriler adresin # kısmında gelir (sunucuya hiç gönderilmez); Telegram kendi parametrelerini ekleyebilir
  function parametreler() {
    const p = new URLSearchParams(location.search);
    const h = location.hash.replace(/^#/, "").replace(/\?/g, "&");
    for (const [k, v] of new URLSearchParams(h)) if (!p.has(k)) p.set(k, v);
    return p;
  }
  // Bot kullanıcı adlarını (sadece isim; ID adrese konmaz) #k=<JSON liste> ile gönderir
  // Seçim bota JSON olarak gider: {"tur":"id","secim":"ben|grup|ara","ad":"...","tam":true}
  const tg0 = window.Telegram && Telegram.WebApp;
  // Telegram içinde açıldıysa platform bilinir (menü düğmesiyle açılınca initData boş gelir, ona bakılmaz)
  const tg = tg0 && tg0.platform && tg0.platform !== "unknown" ? tg0 : null;
  const $ = id => document.getElementById(id);
  let adlar = [];
  try { adlar = JSON.parse(parametreler().get("k") || "[]"); } catch (e) { adlar = []; }
  const kucuk = s => s.replace(/İ/g, "i").replace(/I/g, "ı").toLowerCase();
  function listele() {
    const f = kucuk($("filtre").value.trim()), sel = $("ad"), once = sel.value;
    sel.innerHTML = "";
    const es = adlar.filter(a => !f || kucuk(a).includes(f));
    for (const a of es) { const o = document.createElement("option"); o.value = o.textContent = a; sel.appendChild(o); }
    if (es.includes(once)) sel.value = once;
    if (!es.length) { const o = document.createElement("option"); o.disabled = true; o.textContent = adlar.length ? "Eşleşen kullanıcı yok" : "Kayıtlı kullanıcı yok"; sel.appendChild(o); }
  }
  $("filtre").addEventListener("input", listele);
  listele();

  let secim = "ben";
  document.querySelectorAll(".secenek button").forEach(b => b.onclick = () => {
    secim = b.dataset.secim;
    document.querySelectorAll(".secenek button").forEach(x => x.classList.toggle("secili", x === b));
    $("araAlan").classList.toggle("gizli", secim !== "ara");
  });

  function gonder() {
    const ad = $("ad").value;
    $("u_ad").textContent = "";
    if (secim === "ara" && !ad) {
      $("u_ad").textContent = "Lütfen listeden bir kullanıcı seçiniz.";
      tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("error");
      return;
    }
    if (!tg) { alert("Bu form Telegram içinden açılmalıdır."); return; }
    tg.sendData(JSON.stringify({ tur: "id", secim, ad, tam: true }));
  }

  if (tg) {
    tg.ready(); tg.expand();
    tg.MainButton.setText("Göster").show().onClick(gonder);
  } else {
    $("gonder").style.display = "block"; $("gonder").onclick = gonder;
  }
</script>
</body>
</html>
